name: CI

on:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            build-essential \
            libargtable2-dev \
            libtool \
            zlib1g-dev \
            bzip2 \
            wget

      - name: Bootstrap
        run: autoreconf -fi

      - name: Configure
        run: ./configure

      - name: Build
        run: make -j2

      - name: Run tests
        run: make check
